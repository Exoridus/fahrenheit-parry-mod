name: Setup build environment
description: >-
  Shared toolchain setup for CI and Release. Keeping this in one place is what
  stops the two workflows from drifting apart: a green CI run must exercise the
  same environment the release build gets.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: "10.0.x"
  cache-key-suffix:
    description: >-
      Extra discriminator appended to the vcpkg cache key. Use it when a job
      needs its own vcpkg archive slot.
    required: false
    default: ""
  bootstrap-vcpkg:
    description: >-
      Run bootstrap-vcpkg.bat before integrating. Required for the native
      stage0/stage1 build; harmless otherwise.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Cache vcpkg archives
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: windows-vcpkg-${{ hashFiles('fahrenheit.release.ref', 'build.proj') }}${{ inputs.cache-key-suffix }}
        restore-keys: |
          windows-vcpkg-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Bootstrap and integrate vcpkg
      shell: cmd
      run: |
        if "%VCPKG_INSTALLATION_ROOT%"=="" (
          echo ERROR: VCPKG_INSTALLATION_ROOT is not set on this runner.
          exit /B 1
        )
        pushd "%VCPKG_INSTALLATION_ROOT%"
        if /I "${{ inputs.bootstrap-vcpkg }}"=="true" (
          call bootstrap-vcpkg.bat -disableMetrics
          if errorlevel 1 exit /B 1
        )
        call vcpkg integrate install
        if errorlevel 1 exit /B 1
        popd
