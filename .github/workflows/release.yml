name: Release

# The tag is an OUTPUT of a successful release build, not its trigger.
#
# Previously this workflow ran on `push: tags: [v*]`, so a failing release build
# left the tag already published. Because tags are immutable, the only way out
# was to burn the next patch number. Now the run is dispatched with the intended
# version, and the tag is created in the final step -- if anything before it
# fails, no tag exists and the same version can simply be dispatched again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.5.2). Must not already exist.'
        required: true
        type: string
      dry_run:
        description: 'Build and package without creating the tag or the release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  release:
    name: Release Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version input
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version must look like v1.2.3, got '$version'."
          }
          git rev-parse -q --verify "refs/tags/$version" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $version already exists. Tags are immutable; pick the next version."
          }
          $manifest = (Get-Content fhparry.manifest.json -Raw | ConvertFrom-Json).version
          if ("v$manifest" -ne $version) {
            throw "Manifest version is $manifest but the release was dispatched as $version. Run build.cmd release-bump first."
          }
          Write-Host "Releasing $version from $(git rev-parse --short HEAD)."

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Full release build
        shell: cmd
        run: build.cmd build --configuration Release --repo "${{ github.repository }}"

      - name: Package release archives
        shell: cmd
        run: build.cmd release-pack --tag "${{ inputs.version }}" --deploy-dir ".workspace\fahrenheit\artifacts\deploy\rel" --out-dir ".release"

      - name: Validate release asset sizes
        shell: pwsh
        env:
          MAX_FULL_ZIP_MB: "200"
          MAX_MOD_ZIP_MB: "64"
        run: ./.github/scripts/Assert-ReleaseAssets.ps1 -Tag "${{ inputs.version }}" -Directory ".release"

      - name: Generate release notes
        shell: cmd
        run: build.cmd release-notes --tag "${{ inputs.version }}" --repo "${{ github.repository }}" --out ".release\release-notes.txt"

      - name: Upload artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dryrun-${{ inputs.version }}
          path: .release
          if-no-files-found: error

      # Creates the tag as part of publishing, from the commit this run built.
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .release/release-notes.txt
          files: |
            .release/fahrenheit-full-${{ inputs.version }}.zip
            .release/fhparry-mod-${{ inputs.version }}.zip
            .release/fahrenheit-full-${{ inputs.version }}.zip.sha256
            .release/fhparry-mod-${{ inputs.version }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
